name: Update Football Fun Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run updater
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: python update.py

      - name: Commit only real data changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add live-results.json
          if git diff --staged --quiet -- live-results.json; then
            echo "No football data changes to commit."
            exit 0
          fi
          git commit -m "Auto update Football Fun data"
          git push
